<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Азиатский финансовый кризис 1997–1998 — интерактивный атлас</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="mode-intro">
<header id="top">
  <div class="brand">АФК 1997–1998</div>
  <div class="top-actions">
    <button id="btnGlobe" class="btn ghost" title="Esc">🌍 Глобус</button>
    <button id="btnChips" class="btn ghost" title="Метки S-номеров">🏷</button>
    <button id="btnSources" class="btn ghost">📚 Источники</button>
  </div>
</header>

<main id="stage">
  <div id="globeWrap">
    <canvas id="globeCanvas" aria-label="3D-глобус с городами и дугами капитала"></canvas>
    <div id="intro">
      <h1>Азиатский финансовый<br>кризис 1997–1998</h1>
      <p>Нажмите на страну на глобусе.</p>
      <div class="intro-actions">
        <button id="btnStart" class="btn primary">Начать: Таиланд →</button>
        <button id="btnExplore" class="btn">Исследовать глобус</button>
      </div>
    </div>
    <div id="globeHud">
      <div id="chips"></div>
      <div id="tip" class="tip" hidden></div>
    </div>
  </div>

  <div id="dash" hidden></div>

  <section id="panel" aria-live="polite">
    <div id="panelHead"></div>
    <nav id="tabs" role="tablist"></nav>
    <div id="panelBody"></div>
  </section>
</main>

<footer id="bottom">
  <button id="btnPrev" class="btn">← Назад</button>
  <div id="progress"></div>
  <button id="btnNext" class="btn primary">Дальше →</button>
</footer>

<div id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h2>Источники</h2>
      <div class="filters">
        <button data-f="country" class="btn small on">Эта страна</button>
        <button data-f="all" class="btn small">Все</button>
        <button data-o="all" class="btn small on">docs+web</button>
        <button data-o="docs" class="btn small">docs</button>
        <button data-o="web" class="btn small">web</button>
        <button id="modalClose" class="btn small">✕</button>
      </div>
    </div>
    <div id="srcList"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="js/sources.js"></script>
<script src="js/data.js"></script>
<script src="js/geo.js"></script>
<script src="js/images.js"></script>
<script src="js/regions.js"></script>
<script src="js/globe.js"></script>
<script src="js/charts.js"></script>
<script src="js/dash.js"></script>
<script src="js/sims/thailand.js"></script>
<script src="js/sims/hongkong.js"></script>
<script src="js/sims/indonesia.js"></script>
<script src="js/sims/philippines.js"></script>
<script src="js/sims/korea.js"></script>
<script src="js/sims/malaysia.js"></script>
<script src="js/app.js"></script>
</body>
</html>
